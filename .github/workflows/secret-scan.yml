# Secret scan on every push and PR.
# TODO before relying on this: replace version tags with verified full commit SHAs
# (supply-chain hardening, scenario S8), and verify the gitleaks release checksum.
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 tag, verified via GitHub API 2026-10-27
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned version)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"  # from GitHub release asset digest
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan history (redacted)
        run: ./gitleaks git --redact --config .gitleaks.toml --exit-code 1 .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 tag, verified via GitHub API 2026-10-27
        with:
          persist-credentials: false

      - name: Install uv (pinned)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2, verified via GitHub API 2026-10-27
        with:
          version: "0.13.4"

      - name: Install gitleaks (pinned, checksum-verified; see ADR-0002)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz gitleaks

      - name: Sync dependencies (locked)
        run: uv sync --python 3.11 --locked

      - name: Lint, format, types
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy sentinel

      - name: Tests
        run: uv run pytest -q

      - name: Coverage regression check (simulated-logic baseline)
        run: uv run sentinel coverage --check

