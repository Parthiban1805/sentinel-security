[project]
name = "sentinel"
dynamic = ["version"]
description = "Internal AI & developer security system: detect, correlate, respond, verify"
requires-python = ">=3.11"
dependencies = [
    "google-auth==2.36.0",
    "jsonschema==4.23.0",
    "requests==2.32.3",
    "truststore==0.10.0",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "types-jsonschema==4.23.0.20241208",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "sentinel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

# docs/schemas stays the single source of truth; the wheel carries a copy so an installed
# Sentinel works outside this repository (ADR-0013).
[tool.hatch.build.targets.wheel.force-include]
"docs/schemas" = "sentinel/_schemas"

# The source archive ships only what a build needs, not internal docs, tests or research.
[tool.hatch.build.targets.sdist]
include = ["/sentinel", "/docs/schemas", "/README.md", "/pyproject.toml"]  # anchored to the root

[tool.ruff]
line-length = 100
target-version = "py311"
# .claude/hooks are protected guard scripts (not edited by the agent); excluded from lint/format
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "E501"]
"scripts/**" = ["S603", "S607"]
"sentinel/alerts.py" = ["E501"]  # embedded PowerShell script
"sentinel/dependencies.py" = ["E501"]  # popular-package data lists
"sentinel/simulation/evalset.py" = ["E501"]  # case table: one readable line per expectation
# Hook patches are stdlib-only scripts that run under whatever python the user has (keep them
# conservative: timezone.utc, bare except-pass so logging can never affect a decision).
"docs/patches/**" = ["E501", "UP", "S110"]

[tool.mypy]
python_version = "3.11"
strict = true

# Optional extra `ai` (ADR-0014): imported lazily, may be absent in a base install.
[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*", "keyring", "keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
