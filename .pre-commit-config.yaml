# Install: pip install pre-commit && pre-commit install
# Update pins deliberately: pre-commit autoupdate, then review the diff.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1  # verified release 2026-10-27; review changes before bumping
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0  # verify and pin
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
      - id: check-json
      - id: check-yaml
