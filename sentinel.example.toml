# Copy to sentinel.toml (git-ignored) and edit. No secrets in this file:
# GitHub token comes from env SENTINEL_GITHUB_TOKEN; Google uses Application Default Credentials.
first_run_lookback_days = 7

[scan]
paths = ["P:/development/example-repo"]

# Places outside Git that can hold a key (S2): CI logs, build output, an agent transcript, a history file.
# Nothing outside Git is scanned unless you list it. Absolute paths only; a drive root or your whole home
# folder is refused, and so are credential stores (.ssh, .aws, gcloud ...) unless you also set
# allow_credential_stores = true. Findings keep a fingerprint, the file name and a line, never the value.
# See ADR-0011.
# extra_paths = ["P:/ci-logs", "P:/builds/output"]

[github]
repos = ["owner/repo"]
user_keys = true          # watch the authenticated user's SSH keys
audit = true              # branch protection + secret scanning audit (token needs Administration: read)
audit_interval_hours = 24

[gcp]
projects = ["my-demo-project"]
usage_multiple = 3.0      # usage anomaly when volume > max(multiple * 7-day mean, floor)
usage_floor = 50

# Exposure probes (S1/S15): checks YOUR hosts for served .env/.git/backup files. Nothing is contacted
# unless you list a host here AND confirm you own it. Content is never stored. See ADR-0008.
# [probes]
# interval_hours = 24
# [[probes.hosts]]
# url = "https://example.com"      # bare host only (no path)
# confirm_ownership = true         # required: you own or run this host
# allow_http = false               # set true only for a plain-http staging host

[alerts]
toast = true              # Windows notification for new real high/critical incidents

# AI investigation assistant (v0.6, ADR-0014). Used only by `incident summary <ID> --ai`, which sends a
# disguised evidence pack (no names, paths or keys) to api.anthropic.com after you confirm.
# Key: `sentinel ai set-key` (OS credential store). Install: the optional extra `sentinel[ai]`.
# [assistant]
# provider = "anthropic"           # or "nvidia" (ADR-0015): then `sentinel ai set-key --provider nvidia`
# model = "claude-sonnet-5-5"     # or claude-opus-5-5; for nvidia: an NVIDIA model id
# deep_model = "claude-opus-5-5"  # used with --deep
# max_output_tokens = 8000
# daily_calls = 30
# monthly_usd = 20.0              # also set this cap in the Anthropic console (the hard limit)
# fallbacks = true                # server-side refusal fallback; another model may answer

# Docker sandbox (v0.7b, ADR-0017): `sentinel sandbox run -- <command>` runs code with no network, in a scratch copy of the
# tracked files without secrets. The image MUST be pinned by digest (docker image inspect prints it after docker pull).
# [sandbox]
# image = "python@sha256:<64 hex characters>"
# memory = "1g"
# cpus = "2"
# timeout_s = 300
#
# Egress allow-list (v0.7f, ADR-0026), used only by `sentinel sandbox run --allow-net`. The sandbox then sits on an
# internal Docker network whose only exit is a proxy (run from the same image): HTTPS to these hosts only (CONNECT,
# port 443 unless written as host:port; "*.example.org" covers subdomains, not the bare name), no IP addresses, and
# any host that resolves to a private, loopback, link-local or cloud-metadata address is refused. Plain HTTP only
# for GET/HEAD on the listed path prefixes. Each refusal is recorded as an egress_anomaly event. The proxy makes
# connections to these hosts on the sandbox's behalf: list only hosts you would let the code send data to.
# [sandbox.egress]
# allow = ["pypi.org", "files.pythonhosted.org"]
# http = ["GET deb.debian.org /debian/"]
