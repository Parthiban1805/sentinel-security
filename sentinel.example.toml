# Copy to sentinel.toml (git-ignored) and edit. No secrets in this file:
# GitHub token comes from env SENTINEL_GITHUB_TOKEN; Google uses Application Default Credentials.
first_run_lookback_days = 7

[scan]
paths = ["P:/development/example-repo"]

# Places outside Git that can hold a key (S2): CI logs, build output, an agent transcript, a history file.
# Nothing outside Git is scanned unless you list it. Absolute paths only; a drive root or your whole home
# folder is refused, and so are credential stores (.ssh, .aws, gcloud ...) unless you also set
# allow_credential_stores = true. Findings keep a fingerprint, the file name and a line, never the value.
# See ADR-0011.
# extra_paths = ["P:/ci-logs", "P:/builds/output"]

[github]
repos = ["owner/repo"]
user_keys = true          # watch the authenticated user's SSH keys
audit = true              # branch protection + secret scanning audit (token needs Administration: read)
audit_interval_hours = 24

[gcp]
projects = ["my-demo-project"]
usage_multiple = 3.0      # usage anomaly when volume > max(multiple * 7-day mean, floor)
usage_floor = 50

# Exposure probes (S1/S15): checks YOUR hosts for served .env/.git/backup files. Nothing is contacted
# unless you list a host here AND confirm you own it. Content is never stored. See ADR-0008.
# [probes]
# interval_hours = 24
# [[probes.hosts]]
# url = "https://example.com"      # bare host only (no path)
# confirm_ownership = true         # required: you own or run this host
# allow_http = false               # set true only for a plain-http staging host

[alerts]
toast = true              # Windows notification for new real high/critical incidents
